name: Cypress E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # This installs dependencies and runs all specs automatically
          browser: chrome
        env:
          # Ensure the base URL is set correctly for CI
          CYPRESS_BASE_URL: https://www.practicesoftwaretesting.com
          # Help bypass bot detection
          CYPRESS_HEADERS: '{"Accept-Language": "en-US,en;q=0.9"}'

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
