name: Cypress E2E Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  # Resolve Node.js 20 deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cypress-run:
    name: Run Cypress Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Run tests in parallel across 2 machines
        containers: [1, 2]

    steps:
      # ── 1. Checkout repository ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 3.5 Warm-up request ────────────────────────────────────────────────
      - name: Warm-up Site
        run: curl -I -L https://practicesoftwaretesting.com || true

      # ── 4. Run original 15 test cases (Part 1 spec) ───────────────────────
      - name: Run Part 1 — Original 15 Test Cases
        run: npx cypress run --spec "cypress/e2e/practicesoftwaretesting.cy.js" --headless --browser electron
        env:
          CYPRESS_BASE_URL: https://practicesoftwaretesting.com

      # ── 5. Run POM-based spec (Part 2 — Page Object Model) ────────────────
      - name: Run Part 2 — POM Spec
        run: npx cypress run --spec "cypress/e2e/practicesoftwaretesting.pom.cy.js" --headless --browser electron
        env:
          CYPRESS_BASE_URL: https://practicesoftwaretesting.com

      # ── 6. Run BDD Cucumber feature files (Part 2 — BDD) ──────────────────
      - name: Run Part 2 — BDD Cucumber Features
        run: npx cypress run --spec "cypress/e2e/features/**/*.feature" --headless --browser electron
        env:
          CYPRESS_BASE_URL: https://practicesoftwaretesting.com

      # ── 7. Upload screenshots on failure ──────────────────────────────────
      - name: Upload screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore

      # ── 8. Upload videos (always) ─────────────────────────────────────────
      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ matrix.containers }}
          path: cypress/videos
          if-no-files-found: ignore

      # ── 9. Upload Cucumber JSON report ────────────────────────────────────
      - name: Upload Cucumber report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report-${{ matrix.containers }}
          path: cypress/cucumber-json
          if-no-files-found: ignore
